<nav class="navbar" aria-label="Navigazione principale">

  <a class="logo icon-text" routerLink="/home">
    <span class="material-icons" aria-hidden="true">auto_stories</span>
    Biblioteca
  </a>

  <button
    class="icon-button mobile-toggle"
    type="button"
    aria-label="Apri menu di navigazione"
    aria-controls="main-navigation"
    [attr.aria-expanded]="menuOpen"
    (click)="toggleMenu()">

    <span class="material-icons" aria-hidden="true">menu</span>

  </button>

  <div
    id="main-navigation"
    class="links"
    [class.open]="menuOpen">

    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="menuOpen = false">

      <span class="icon-text">
        <span class="material-icons" aria-hidden="true">home</span>
        Home
      </span>

    </a>

    <a
      routerLink="/books"
      routerLinkActive="active"
      (click)="menuOpen = false">

      <span class="icon-text">
        <span class="material-icons" aria-hidden="true">menu_book</span>
        Catalogo
      </span>

    </a>

    <a
      routerLink="/book-requests"
      routerLinkActive="active">

      <span class="icon-text">
        <span class="material-icons" aria-hidden="true">how_to_vote</span>
        Richieste libri
      </span>
    
    </a>

    <a
      routerLink="/loans"
      routerLinkActive="active"
      (click)="menuOpen = false">

      <span class="icon-text">
        <span class="material-icons" aria-hidden="true">assignment</span>
        Prestiti
      </span>

    </a>

    <a
      *hasRole="['ROLE_ADMIN','ROLE_LIBRARIAN']"
      routerLink="/users"
      routerLinkActive="active"
      (click)="menuOpen = false">

      <span class="icon-text">
        <span class="material-icons" aria-hidden="true">groups</span>
        Utenti
      </span>

    </a>

    <a *hasRole="['ROLE_ADMIN','ROLE_LIBRARIAN']" routerLink="/admin/dashboard" routerLinkActive="active" 
          (click)="menuOpen = false">

        <span class="icon-text">
          <span class="material-icons" aria-hidden="true">analytics</span>
          Dashboard
        </span>

    </a>

     <a
      *hasRole="['ROLE_ADMIN']"
      routerLink="/operators"
      routerLinkActive="active"
      (click)="menuOpen = false">

      <span class="icon-text">
        <span class="material-icons" aria-hidden="true">admin_panel_settings</span>
        Operatori
      </span>

    </a>

  </div>

  <div class="actions">

    <button
      class="user-menu-button"
      type="button"
      aria-label="Menu utente"
      [matMenuTriggerFor]="userMenu">

      <span class="material-icons" aria-hidden="true">
        account_circle
      </span>

      <span class="username">
        {{ name }}
      </span>

      <span class="material-icons" aria-hidden="true">
        arrow_drop_down
      </span>

    </button>

    <mat-menu #userMenu="matMenu" xPosition="before">

      <button
        *hasRole="['ROLE_READER']"
        mat-menu-item
        routerLink="/profile">

        <span class="material-icons" aria-hidden="true">
          person
        </span>

        <span>Profilo</span>

      </button>

      <button
        *hasRole="['ROLE_READER']"
        mat-menu-item
        (click)="unsubscribe()">

        <span class="material-icons" aria-hidden="true">
          person_remove
        </span>

        <span>Disiscriviti</span>

      </button>

      <button
        mat-menu-item
        (click)="logout()">

        <span class="material-icons" aria-hidden="true">
          logout
        </span>

        <span>Logout</span>

      </button>

    </mat-menu>

    <button
      class="icon-button"
      type="button"
      [attr.aria-label]="theme.isDark() ? 'Attiva tema chiaro' : 'Attiva tema scuro'"
      (click)="theme.toggle()">

      <span class="material-icons" aria-hidden="true">
        {{ theme.isDark() ? 'light_mode' : 'dark_mode' }}
      </span>

    </button>

  </div>

</nav>
