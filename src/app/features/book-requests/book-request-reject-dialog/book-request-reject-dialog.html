<div class="dialog-header">

  <h2 mat-dialog-title>
    {{ data.title }}
  </h2>

  <button
    class="icon-button"
    type="button"
    aria-label="Chiudi finestra"
    [mat-dialog-close]="null">

    <span
      class="material-icons"
      aria-hidden="true">
      close
    </span>

  </button>

</div>

<mat-dialog-content>

  <p class="dialog-message">
    {{ data.message }}
  </p>

  <div class="reason-container">

    <form [formGroup]="form" (submit)="confirm()">

       <mat-dialog-content class="form-column">

        <mat-form-field appearance="outline">
          <mat-label> Motivazione (facoltativa)</mat-label>
          <textarea matInput formControlName="reason"></textarea>
        </mat-form-field>

       </mat-dialog-content>
      
      <mat-dialog-actions align="end">

        <button mat-button type="button" [mat-dialog-close]="null">
            Annulla
        </button>

        <button mat-raised-button color="warn" type="submit" [disabled]="form.invalid">
            Rigetta
          </button>

      </mat-dialog-actions>
    </form>
    
  </div>

</mat-dialog-content>
