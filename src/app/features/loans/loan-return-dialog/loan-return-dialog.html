<div class="dialog-header">

  <h2 mat-dialog-title>
    Registrazione reso
  </h2>

  <button class="icon-button" type="button" aria-label="Chiudi finestra" (click)="close()">
    <span class="material-icons" aria-hidden="true">close</span>
  </button>

</div>

<form [formGroup]="form">

  <mat-dialog-content>

    <div class="form-column">

      <mat-form-field>
        <mat-label>
          Presito
        </mat-label>

        <input matInput formControlName="loanId" readonly>

      </mat-form-field>

      <mat-form-field>

        <mat-label>
          Data del reso
        </mat-label>

        <input matInput [matDatepicker]="returnPicker" formControlName="returnDate">

        <mat-datepicker-toggle matIconSuffix [for]="returnPicker"></mat-datepicker-toggle>

        <mat-datepicker #returnPicker></mat-datepicker>

        @if (isInvalid('returnDate')) {
          <mat-error>
            Data reso obbligatoria
          </mat-error>
        }

      </mat-form-field>
      
    </div>

  </mat-dialog-content>

</form>

<mat-dialog-actions>

  <button mat-button type="button" (click)="reset()">
    Reset
  </button>

  <button mat-button type="button" (click)="close()">
    Cancella
  </button>

  <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid" (click)="submit()">
    Salva
  </button>

</mat-dialog-actions>
