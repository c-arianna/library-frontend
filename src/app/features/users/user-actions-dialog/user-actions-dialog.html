<div class="dialog-header">

    <h2>
        {{ isSuspend ? 'Sospendi utente' : 'Riattiva utente' }}
    </h2>

    <button class="icon-button" (click)="close()">
        <span class="material-icons">close</span>
    </button>

</div>

<form [formGroup]="form">

  <mat-dialog-content>
    
    <div class="form-column">

        <mat-form-field>

        <mat-label>
            Motivazione
        </mat-label>

        <textarea matInput rows="4" formControlName="reason"></textarea>

        </mat-form-field>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end">

    <button mat-button type="button" (click)="reset()">
      Reset
    </button>

    <button mat-button type="button" (click)="close()">
      Cancella
    </button>

    <button mat-raised-button color="primary" type="button" (click)="submit()">
      {{ isSuspend ? 'Sospendi' : 'Riattiva' }}
    </button>

  </mat-dialog-actions>

</form>
