<div class="container text-center">

  <h1 class="page-title icon-text">
    <span class="material-icons">waving_hand</span>
    Benvenuto, {{ name }}
  </h1>

  <div class="grid">

    <a routerLink="/books" class="card home-card icon-text">
      <span class="material-icons">menu_book</span>
      <span>Catalogo</span>
    </a>

  </div>

  <div class="grid">

    <a routerLink="/loans" class="card home-card icon-text">
      <span class="material-icons">assignment</span>
      <span>Prestiti</span>
    </a>

  </div>

  <div *hasRole="['ROLE_ADMIN','ROLE_LIBRARIAN']" class="grid">

    <a routerLink="/users" class="card home-card icon-text">
      <span class="material-icons">groups</span>
      <span>Utenti Registrati</span>
    </a>

  </div>

</div>
