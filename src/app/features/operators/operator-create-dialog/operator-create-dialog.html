<div class="dialog-header">

  <h2 mat-dialog-title class="icon-text">
    Aggiungi operatore
  </h2>

  <button class="icon-button" type="button" aria-label="Chiudi finestra" (click)="close()">
    <span class="material-icons" aria-hidden="true">close</span>
  </button>

</div>

<form [formGroup]="form">

  <mat-dialog-content>

    <div class="form-column">
      
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" autocomplete="email">  
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="name" autocomplete="given-name">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Cognome</mat-label>
          <input matInput formControlName="lastname" autocomplete="family-name">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input type="password" matInput formControlName="password" autocomplete="new-password">
        </mat-form-field>

      <mat-form-field appearance="outline">

  <mat-label>Ruolo</mat-label>

  <mat-select formControlName="role">

    <mat-option value="LIBRARIAN">
      Bibliotecario
    </mat-option>

    <mat-option value="ADMIN">
      Amministratore
    </mat-option>

  </mat-select>

</mat-form-field>
      </div>    
    </mat-dialog-content>

  </form>

  <mat-dialog-actions>
      
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid" (click)="submit()">
        Salva
      </button>

      <button mat-button type="button" (click)="reset()">Reset</button>

      <button mat-button type="button" (click)="close()">Cancella</button>

  </mat-dialog-actions>
