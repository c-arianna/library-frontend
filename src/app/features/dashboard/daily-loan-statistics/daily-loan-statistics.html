<main class="container">

    <nav class="breadcrumb" aria-label="Breadcrumb">

      <a routerLink="/admin/dashboard">
        Dashboard amministrativa
      </a>

      <span>/</span>

      <span aria-current="page">
        Prestiti per giorno
      </span>

    </nav>

    <h1 class="page-title icon-text">
        <span class="material-icons" aria-hidden="true">
          insights
        </span>

        Prestiti per giorno
    </h1>

      <p class="section-description">
        Andamento giornaliero dei prestiti della biblioteca.
      </p>

    <div class="chart-filters">

      <button type="button" class="filter-button" [class.active]="selectedDays() === 7" (click)="applyPresetFilter(7)">
        7 giorni
      </button>

      <button type="button" class="filter-button" [class.active]="selectedDays() === 30" (click)="applyPresetFilter(30)">
        30 giorni
      </button>

      <button type="button" class="filter-button" [class.active]="selectedDays() === 90" (click)="applyPresetFilter(90)">
        90 giorni
      </button>

    <button type="button" class="filter-button" [class.active]="selectedDays() === 365" (click)="applyPresetFilter(365)">
      Anno
    </button>

    </div>

    @if (isCustomFilter()) {

      <div class="custom-filter">

        <span
          class="material-icons"
          aria-hidden="true">
          auto_awesome
        </span>

        <div class="custom-filter-text">

          <div class="custom-filter-title">
            Filtro personalizzato
          </div>

          <div class="custom-filter-value">
            Ultimi {{ selectedDays() }} giorni
          </div>

        </div>

      </div>

    }

    <div class="chart-container">
      <canvas #loanChart></canvas>
    </div>

</main>
